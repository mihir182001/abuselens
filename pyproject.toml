[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abuselens"
version = "0.1.0"
description = "Real-time malicious URL detection and abuse trend analytics platform"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "lifelines>=0.27",
  "joblib>=1.3",
  "tldextract>=5.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.0",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.33", "plotly>=5.20"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
abuselens = "abuselens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
